experiment_name: twist_autoaugment_e100
source_reference: DACON AutoAugment idea adapted to CIFAR-10 ViT; architecture kept identical to vit_baseline_e100

data:
  dataset: CIFAR10
  data_dir: data
  image_size: 32
  num_classes: 10
  train_augmentation: true
  augmentation_policy: autoaugment

model:
  type: vit
  patch_size: 4
  num_channels: 3
  embed_dim: 256
  hidden_dim: 512
  num_heads: 8
  num_layers: 6
  dropout: 0.2
  pooling_mode: cls
  use_positional_embedding: true

training:
  device: auto
  seed: 42
  deterministic: true
  batch_size: 128
  num_workers: 4
  epochs: 100
  learning_rate: 0.0003
  weight_decay: 0.0
  optimizer: adamw
  scheduler: none
  lr_milestones: []
  lr_gamma: 0.1

visualization:
  save_dataset_samples: true
  save_patch_visualization: true
