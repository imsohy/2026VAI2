experiment_name: capacity_small
source_reference: Model capacity ablation - smaller than UVA baseline; training budget matched to other experiments

data:
  dataset: CIFAR10
  data_dir: data
  image_size: 32
  num_classes: 10
  train_augmentation: true

model:
  type: vit
  patch_size: 4
  num_channels: 3
  embed_dim: 128
  hidden_dim: 256
  num_heads: 4
  num_layers: 3
  dropout: 0.2
  pooling_mode: cls
  use_positional_embedding: true

training:
  device: auto
  seed: 42
  deterministic: true
  batch_size: 128
  num_workers: 4
  epochs: 20
  learning_rate: 0.0003
  weight_decay: 0.0
  optimizer: adamw
  scheduler: none
  lr_milestones: []
  lr_gamma: 0.1

visualization:
  save_dataset_samples: false
  save_patch_visualization: false
