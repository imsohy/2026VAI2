experiment_name: cnn_baseline
source_reference: CNN comparison model

data:
  dataset: CIFAR10
  data_dir: data
  image_size: 32
  num_classes: 10
  train_augmentation: true

model:
  type: cnn
  dropout: 0.2

training:
  device: auto
  seed: 42
  deterministic: true
  batch_size: 128
  num_workers: 4
  epochs: 180
  learning_rate: 0.0003
  weight_decay: 0.0
  optimizer: adamw
  scheduler: multistep
  lr_milestones: [100, 150]
  lr_gamma: 0.1

visualization:
  save_dataset_samples: true
  save_patch_visualization: false
