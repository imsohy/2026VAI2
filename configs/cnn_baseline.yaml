experiment_name: cnn_baseline
source_reference: CNN comparison model; training budget matched to ViT experiments

data:
  dataset: CIFAR10
  data_dir: data
  image_size: 32
  num_classes: 10
  train_augmentation: true

model:
  type: cnn
  dropout: 0.2

training:
  device: auto
  seed: 42
  deterministic: true
  batch_size: 128
  num_workers: 4
  epochs: 20
  learning_rate: 0.0003
  weight_decay: 0.0
  optimizer: adamw
  scheduler: none
  lr_milestones: []
  lr_gamma: 0.1

visualization:
  save_dataset_samples: true
  save_patch_visualization: false
