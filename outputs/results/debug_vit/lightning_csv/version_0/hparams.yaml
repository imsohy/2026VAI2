config:
  data:
    data_dir: data
    dataset: CIFAR10
    image_size: 32
    num_classes: 10
    train_augmentation: true
  experiment_name: debug_vit
  model:
    dropout: 0.1
    embed_dim: 64
    hidden_dim: 128
    num_channels: 3
    num_heads: 2
    num_layers: 1
    patch_size: 4
    pooling_mode: cls
    type: vit
    use_positional_embedding: true
  source_reference: Quick smoke test for ViT training pipeline
  training:
    batch_size: 128
    deterministic: true
    device: auto
    epochs: 1
    learning_rate: 0.0003
    num_workers: 2
    optimizer: adamw
    seed: 42
    weight_decay: 0.0001
  visualization:
    save_dataset_samples: true
    save_patch_visualization: true
