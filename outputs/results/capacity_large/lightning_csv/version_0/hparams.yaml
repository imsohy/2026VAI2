config:
  data:
    data_dir: data
    dataset: CIFAR10
    image_size: 32
    num_classes: 10
    train_augmentation: true
  experiment_name: capacity_large
  model:
    dropout: 0.2
    embed_dim: 384
    hidden_dim: 768
    num_channels: 3
    num_heads: 8
    num_layers: 8
    patch_size: 4
    pooling_mode: cls
    type: vit
    use_positional_embedding: true
  source_reference: Model capacity ablation - larger than UVA baseline; training budget
    matched to other experiments
  training:
    batch_size: 128
    deterministic: true
    device: auto
    epochs: 20
    learning_rate: 0.0003
    lr_gamma: 0.1
    lr_milestones: []
    num_workers: 4
    optimizer: adamw
    scheduler: none
    seed: 42
    weight_decay: 0.0
  visualization:
    save_dataset_samples: false
    save_patch_visualization: false
