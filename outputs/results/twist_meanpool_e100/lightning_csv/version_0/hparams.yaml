config:
  data:
    data_dir: data
    dataset: CIFAR10
    image_size: 32
    num_classes: 10
    train_augmentation: true
  experiment_name: twist_meanpool_e100
  model:
    dropout: 0.2
    embed_dim: 256
    hidden_dim: 512
    num_channels: 3
    num_heads: 8
    num_layers: 6
    patch_size: 4
    pooling_mode: mean
    type: vit
    use_positional_embedding: true
  source_reference: Student twist - UVA baseline architecture with CLS token output
    replaced by mean pooling; final extended training budget matched to other experiments
    at 100 epochs
  training:
    batch_size: 128
    deterministic: true
    device: auto
    epochs: 100
    learning_rate: 0.0003
    lr_gamma: 0.1
    lr_milestones: []
    num_workers: 4
    optimizer: adamw
    scheduler: none
    seed: 42
    weight_decay: 0.0
  visualization:
    save_dataset_samples: false
    save_patch_visualization: false
