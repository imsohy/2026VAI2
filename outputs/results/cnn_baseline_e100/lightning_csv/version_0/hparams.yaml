config:
  data:
    data_dir: data
    dataset: CIFAR10
    image_size: 32
    num_classes: 10
    train_augmentation: true
  experiment_name: cnn_baseline_e100
  model:
    dropout: 0.2
    type: cnn
  source_reference: CNN comparison model; final extended training budget matched to
    ViT experiments at 100 epochs
  training:
    batch_size: 128
    deterministic: true
    device: auto
    epochs: 100
    learning_rate: 0.0003
    lr_gamma: 0.1
    lr_milestones: []
    num_workers: 4
    optimizer: adamw
    scheduler: none
    seed: 42
    weight_decay: 0.0
  visualization:
    save_dataset_samples: true
    save_patch_visualization: false
