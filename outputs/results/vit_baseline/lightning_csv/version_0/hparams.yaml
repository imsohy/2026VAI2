config:
  data:
    data_dir: data
    dataset: CIFAR10
    image_size: 32
    num_classes: 10
    train_augmentation: true
  experiment_name: vit_baseline
  model:
    dropout: 0.2
    embed_dim: 256
    hidden_dim: 512
    num_channels: 3
    num_heads: 8
    num_layers: 6
    patch_size: 4
    pooling_mode: cls
    type: vit
    use_positional_embedding: true
  source_reference: UVA DL Tutorial 15 original ViT baseline hyperparameters
  training:
    batch_size: 128
    deterministic: true
    device: auto
    epochs: 180
    learning_rate: 0.0003
    lr_gamma: 0.1
    lr_milestones:
    - 100
    - 150
    num_workers: 4
    optimizer: adamw
    scheduler: multistep
    seed: 42
    weight_decay: 0.0
  visualization:
    save_dataset_samples: true
    save_patch_visualization: true
